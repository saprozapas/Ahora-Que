  #cuenta { align-self:center; color:var(--muted); }
  .tabla { overflow:auto; max-height:calc(100vh - 150px); margin:0 16px 24px; border:1px solid var(--line); border-radius:12px; }
  table { border-collapse:collapse; width:100%; min-width:1100px; }
  th, td { padding:8px 10px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
  th { position:sticky; top:0; background:var(--accent); color:var(--on); cursor:pointer; white-space:nowrap; user-select:none; }
  tbody tr:nth-child(even) { background:color-mix(in srgb, var(--card) 55%, transparent); }
  td.n { color:var(--muted); font-variant-numeric:tabular-nums; }
  td a { color:var(--accent); }
  .tag { display:inline-block; padding:0 8px; border:1px solid var(--line); border-radius:999px; font-size:13px; white-space:nowrap; }
</style>

<script>
const FILAS = JSON.parse(document.getElementById("datos").textContent);
const COLUMNAS = [
  ["nombre", "Nombre"], ["tipos", "Tipos"], ["barrio", "Barrio"], ["direccion", "Dirección"],
  ["apto", "Apto menores"], ["precio", "Precio"], ["vegano", "Vegana"], ["celiaco", "Celíacos"],
  ["horario", "Horario"], ["osm", "OSM"],
];
const $ = (id) => document.getElementById(id);
const norm = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
let orden = { campo: "nombre", asc: true };

$("cabeza").append(Object.assign(document.createElement("th"), { textContent: "#" }),
  ...COLUMNAS.map(([campo, titulo]) => {
    const th = document.createElement("th");
    th.textContent = titulo;
    th.addEventListener("click", () => {
      orden = { campo, asc: orden.campo === campo ? !orden.asc : true };
      pintar();
    });
    return th;
  }));

const unicos = (f) => [...new Set(FILAS.flatMap(f).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
for (const t of unicos((f) => f.tipos.split(", "))) $("tipo").append(new Option(t, t));
for (const b of unicos((f) => [f.barrio])) $("barrio").append(new Option(b, b));

function pintar() {
  const q = norm($("q").value), tipo = $("tipo").value, barrio = $("barrio").value, solo = $("solo").value;
  const lista = FILAS.filter((f) =>
    (!q || norm(f.nombre + " " + f.direccion + " " + f.barrio + " " + f.tipos).includes(q)) &&
    (!tipo || f.tipos.split(", ").includes(tipo)) &&
    (!barrio || f.barrio === barrio) &&
    (!solo || (solo === "horario" ? f.horario : solo === "direccion" ? f.direccion :
      solo === "sinbarrio" ? !f.barrio : solo === "apto" ? f.apto === "Sí" :
      solo === "vegano" ? f.vegano : f.celiaco))
  );
  lista.sort((a, b) => String(a[orden.campo]).localeCompare(String(b[orden.campo]), "es") * (orden.asc ? 1 : -1));
  $("cuenta").textContent = lista.length + " de " + FILAS.length + " lugares";
  const filas = lista.map((f, i) => {
    const tr = document.createElement("tr");
    const celda = (t, clase) => { const td = document.createElement("td"); td.textContent = t; if (clase) td.className = clase; return td; };
    tr.append(celda(i + 1, "n"));
    for (const [campo] of COLUMNAS) {
      if (campo === "osm") {
        const td = document.createElement("td"), a = document.createElement("a");
        a.textContent = f.osm; a.href = "https://www.openstreetmap.org/" + f.osm; a.target = "_blank"; a.rel = "noopener";
        td.append(a); tr.append(td);
      } else if (campo === "tipos") {
        const td = document.createElement("td");
        for (const t of f.tipos.split(", ")) { const s = document.createElement("span"); s.className = "tag"; s.textContent = t; td.append(s, " "); }
        tr.append(td);
      } else tr.append(celda(f[campo]));
    }
    return tr;
  });
  $("cuerpo").replaceChildren(...filas);
}
["q", "tipo", "barrio", "solo"].forEach((id) => $(id).addEventListener("input", pintar));
pintar();
</script>
