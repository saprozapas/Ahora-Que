<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ahora Qué te ayuda a elegir un plan que funcione para todos.">
    <title>{% block title %}Ahora Qué{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20260908-4') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
</head>
<body>
    <a class="skip-link" href="#contenido">Ir al contenido</a>
    <div class="scroll-progress" aria-hidden="true"><span></span></div>
    <header class="site-header">
        <div class="site-header-inner">
            <a class="brand" href="/" aria-label="Ahora Qué, inicio"><img class="brand-mark" src="{{ url_for('static', filename='favicon.svg') }}" alt=""><span class="brand-name">Ahora <em>Qué</em></span></a>
            <nav class="main-nav" aria-label="Navegación principal"><a href="/explorar">Explorar</a><a href="/grupos">Grupos</a><a href="/#como-funciona">Cómo funciona</a><a href="/contacto">Contacto</a></nav>
            <a class="header-action" href="/register">Crear cuenta <span aria-hidden="true">↗</span></a>
        </div>
    </header>
    <main id="contenido">{% block content %}{% endblock %}</main>
    <footer class="site-footer section-shell"><div><a class="brand" href="/"><img class="brand-mark" src="{{ url_for('static', filename='favicon.svg') }}" alt=""><span class="brand-name">Ahora <em>Qué</em></span></a><p class="footer-note">Una excusa para hacer algo.</p></div><div class="footer-links"><a href="/explorar">Explorar</a><a href="/grupos">Grupos</a><a href="/contacto">Contacto</a><a href="/login">Iniciar sesión</a></div><span class="footer-year">© 2026 Ahora Qué</span></footer>
    <script>
      (() => {
        const progress = document.querySelector('.scroll-progress span');
        let ticking = false;

        const updateProgress = () => {
          const scrollable = document.documentElement.scrollHeight - window.innerHeight;
          progress.style.transform = `scaleX(${scrollable > 0 ? window.scrollY / scrollable : 0})`;
          ticking = false;
        };

        window.addEventListener('scroll', () => {
          if (!ticking) {
            window.requestAnimationFrame(updateProgress);
            ticking = true;
          }
        }, { passive: true });
        updateProgress();

        const revealObserver = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              revealObserver.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12 });

        document.querySelectorAll('main section, main article, .story-card, .contact-form, .auth-form').forEach((element) => {
          element.classList.add('scroll-reveal');
          revealObserver.observe(element);
        });

        document.querySelectorAll('[data-date-picker]').forEach((picker) => {
          const input = picker.querySelector('input[type="date"]');
          const display = picker.querySelector('.date-display');
          const popover = picker.querySelector('.date-popover');
          const title = picker.querySelector('[data-date-title]');
          const grid = picker.querySelector('[data-date-grid]');
          const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
          let viewDate = new Date();
          viewDate.setHours(12, 0, 0, 0);

          const renderCalendar = () => {
            title.textContent = `${months[viewDate.getMonth()]} ${viewDate.getFullYear()}`;
            grid.replaceChildren();
            const firstDay = (new Date(viewDate.getFullYear(), viewDate.getMonth(), 1).getDay() + 6) % 7;
            const daysInMonth = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();
            for (let i = 0; i < firstDay; i += 1) grid.append(document.createElement('span'));
            for (let day = 1; day <= daysInMonth; day += 1) {
              const button = document.createElement('button');
              const month = String(viewDate.getMonth() + 1).padStart(2, '0');
              const date = String(day).padStart(2, '0');
              button.type = 'button';
              button.textContent = day;
              button.dataset.value = `${viewDate.getFullYear()}-${month}-${date}`;
              if (button.dataset.value === input.value) button.classList.add('selected');
              button.addEventListener('click', () => {
                input.value = button.dataset.value;
                display.querySelector('span').textContent = `${date}/${month}/${viewDate.getFullYear()}`;
                picker.classList.remove('is-open');
                display.setAttribute('aria-expanded', 'false');
              });
              grid.append(button);
            }
          };

          display.addEventListener('click', () => {
            picker.classList.toggle('is-open');
            display.setAttribute('aria-expanded', picker.classList.contains('is-open'));
            renderCalendar();
          });
          document.addEventListener('click', (event) => {
            if (!picker.contains(event.target)) {
              picker.classList.remove('is-open');
              display.setAttribute('aria-expanded', 'false');
            }
          });
          document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
              picker.classList.remove('is-open');
              display.setAttribute('aria-expanded', 'false');
            }
          });
          picker.querySelector('[data-date-prev]').addEventListener('click', () => {
            viewDate.setMonth(viewDate.getMonth() - 1);
            renderCalendar();
          });
          picker.querySelector('[data-date-next]').addEventListener('click', () => {
            viewDate.setMonth(viewDate.getMonth() + 1);
            renderCalendar();
          });
          renderCalendar();
        });
      })();
    </script>
</body>
</html>
