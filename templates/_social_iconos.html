{# Íconos de Social: un solo lugar para todos los trazos.
   Uso: {% from '_social_iconos.html' import ico %}  y después  {{ ico('corazon') }}. #}
{% macro ico(nombre) -%}
<svg class="soc-ico soc-ico-{{ nombre }}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  {%- if nombre == 'corazon' %}<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>
  {%- elif nombre == 'comentario' %}<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>
  {%- elif nombre == 'guardar' %}<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
  {%- elif nombre == 'basura' %}<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>
  {%- elif nombre == 'bandera' %}<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V4s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/>
  {%- elif nombre == 'mundo' %}<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
  {%- elif nombre == 'amigos' %}<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>
  {%- elif nombre == 'enviar' %}<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>
  {%- elif nombre == 'imagen' %}<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
  {%- elif nombre == 'cerrar' %}<path d="M18 6L6 18M6 6l12 12"/>
  {%- endif -%}
</svg>
{%- endmacro %}
