<aside class="dashboard-sidebar" aria-label="Navegación del dashboard">
  <div class="dashboard-sidebar-top">
    <button class="dashboard-sidebar-toggle" type="button" aria-label="Contraer navegación" aria-expanded="true">←</button>
  </div>
  <nav class="dashboard-sidebar-nav" aria-label="Secciones del dashboard">
    <a class="dashboard-sidebar-link{% if request.path == '/dashboard' %} is-active{% endif %}" href="/dashboard"{% if request.path == '/dashboard' %} aria-current="page"{% endif %}>
      <span aria-hidden="true"><svg viewBox="0 0 24 24" role="img"><path d="M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 21v-6h6v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
      <span>Inicio</span>
    </a>
    <a class="dashboard-sidebar-link{% if request.path.startswith('/grupos') %} is-active{% endif %}" href="/grupos"{% if request.path.startswith('/grupos') %} aria-current="page"{% endif %}>
      <span aria-hidden="true"><svg viewBox="0 0 24 24" role="img"><circle cx="9" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17" cy="9" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 19c.6-3 2.4-4.5 5.5-4.5s4.9 1.5 5.5 4.5M14 15c2.7-.3 4.7 1 5.3 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
      <span>Grupos</span>
    </a>
    <a class="dashboard-sidebar-link{% if request.path.startswith('/social') %} is-active{% endif %}" href="/social"{% if request.path.startswith('/social') %} aria-current="page"{% endif %}>
      <span aria-hidden="true"><svg viewBox="0 0 24 24" role="img"><circle cx="6" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m7.7 11 8.5-4M7.7 13l8.5 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
      <span>Social</span>
    </a>
    <a class="dashboard-sidebar-link{% if request.path.startswith('/perfil') %} is-active{% endif %}" href="/perfil"{% if request.path.startswith('/perfil') %} aria-current="page"{% endif %}>
      <span aria-hidden="true"><svg viewBox="0 0 24 24" role="img"><circle cx="12" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c.7-3.5 3-5.3 7-5.3s6.3 1.8 7 5.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
      <span>Perfil</span>
    </a>
  </nav>
</aside>
