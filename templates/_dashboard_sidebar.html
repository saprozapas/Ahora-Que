<!--
  Navegación del dashboard.

  En escritorio es una barra lateral que se puede contraer.
  En celular el CSS la convierte en una fila de pestañas arriba del
  contenido: antes era position:fixed y tapaba permanentemente los 220px
  izquierdos de la pantalla.
-->

<aside class="dashboard-sidebar" aria-label="Navegación del dashboard">

  <div class="dashboard-sidebar-top">

    <button
      class="dashboard-sidebar-toggle"
      type="button"
      aria-label="Contraer navegación"
      aria-expanded="true"
    >
      ←
    </button>

  </div>


  <nav class="dashboard-sidebar-nav" aria-label="Secciones del dashboard">

    <a
      class="dashboard-sidebar-link{% if request.path == '/dashboard' %} is-active{% endif %}"
      href="/dashboard"
      {% if request.path == '/dashboard' %}aria-current="page"{% endif %}
    >
      <span aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path
            d="M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19.5z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
          <path
            d="M9 21v-6h6v6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
        </svg>
      </span>

      <span>Inicio</span>
    </a>


    <a class="dashboard-sidebar-link" href="/inbox">
      <span aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path
            d="M22 12h-6l-2 3h-4l-2-3H2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
          <path
            d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <span>Inbox</span>

      {% if notificaciones_pendientes and notificaciones_pendientes > 0 %}
        <span class="inbox-notification">
          {{ notificaciones_pendientes }}
        </span>
      {% endif %}
    </a>


    <a
      class="dashboard-sidebar-link{% if request.path.startswith('/grupos') %} is-active{% endif %}"
      href="/grupos"
      {% if request.path.startswith('/grupos') %}aria-current="page"{% endif %}
    >
      <span aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <circle
            cx="9"
            cy="8"
            r="3"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <circle
            cx="17"
            cy="9"
            r="2.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <path
            d="M3.5 19c.6-3 2.4-4.5 5.5-4.5s4.9 1.5 5.5 4.5M14 15c2.7-.3 4.7 1 5.3 3.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <span>Grupos</span>
    </a>


    <a
      class="dashboard-sidebar-link{% if request.path.startswith('/amigos') %} is-active{% endif %}"
      href="/amigos"
      {% if request.path.startswith('/amigos') %}aria-current="page"{% endif %}
    >
      <span aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <circle
            cx="9"
            cy="8"
            r="3.2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <path
            d="M3.5 19.5c.6-3.4 2.6-5 5.5-5s4.9 1.6 5.5 5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <path
            d="M16 5.3c1.4.3 2.4 1.5 2.4 3s-1 2.7-2.4 3M18.5 19c-.4-2.4-1.4-3.9-3.1-4.6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <span>Amigos</span>
    </a>


    <a
      class="dashboard-sidebar-link{% if request.path.startswith('/social') %} is-active{% endif %}"
      href="/social"
      {% if request.path.startswith('/social') %}aria-current="page"{% endif %}
    >
      <span aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <circle
            cx="6"
            cy="12"
            r="2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <circle
            cx="18"
            cy="6"
            r="2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <circle
            cx="18"
            cy="18"
            r="2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <path
            d="m7.7 11 8.5-4M7.7 13l8.5 4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <span>Social</span>
    </a>


    <a
      class="dashboard-sidebar-link{% if request.path.startswith('/perfil') %} is-active{% endif %}"
      href="/perfil"
      {% if request.path.startswith('/perfil') %}aria-current="page"{% endif %}
    >
      <span aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <circle
            cx="12"
            cy="8"
            r="3"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <path
            d="M5 20c.7-3.5 3-5.3 7-5.3s6.3 1.8 7 5.3"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <span>Perfil</span>
    </a>
        
    <a
      class="dashboard-sidebar-link{% if request.path.startswith('/planes') %} is-active{% endif %}"
      href="/planes"
      {% if request.path.startswith('/planes') %}aria-current="page"{% endif %}
    >
      <span aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <rect x="4" y="4" width="7" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8" />
          <rect x="13" y="4" width="7" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8" />
          <rect x="4" y="13" width="7" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8" />
          <rect x="13" y="13" width="7" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8" />
        </svg>
      </span>

      <span>Planes</span>
    </a>


    <a class="dashboard-sidebar-link{% if request.path.startswith('/calendario') %} is-active{% endif %}" href="/calendario" {% if request.path.startswith('/calendario') %}aria-current="page"{% endif %}>
      <span aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <rect x="3.5" y="5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M3.5 9.5h17M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </span>

      <span>Calendario</span>
    </a>

  </nav>

</aside>
