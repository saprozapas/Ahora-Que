{% extends 'base.html' %}

{% block title %}Contacto — Ahora Qué{% endblock %}

{% block content %}

<section class="auth container dot-grid">

  <div class="auth__inner auth__inner--wide">

    <header class="auth__head">
      <h1 class="h2">Escribinos.</h1>
      <p class="lead">¿Tenés una idea o encontraste algo que no anda? Contanos.</p>
    </header>


    <form class="auth__form" method="post">

      {% if enviado %}
      <p class="notice" role="status">Mensaje recibido. Gracias por escribirnos.</p>
      {% endif %}

      <div class="field">
        <label for="nombre">Nombre</label>
        <input class="input" id="nombre" name="nombre" type="text" autocomplete="name" required />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" required />
      </div>

      <div class="field">
        <label for="mensaje">Mensaje</label>
        <textarea class="input" id="mensaje" name="mensaje" rows="6" required></textarea>
      </div>

      <button class="btn btn--primary btn--lg btn--block auth__submit" type="submit">Enviar mensaje</button>

    </form>

  </div>

</section>

{% endblock %}
