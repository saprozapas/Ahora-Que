{% extends 'base.html' %}{% block title %}Iniciar sesión — Ahora Qué{% endblock
%}{% block content %}
<section class="auth-page section-shell">
  <div class="auth-intro">
    <p class="eyebrow-chip">qué bueno verte</p>
    <h1>Volvamos a<br /><em>hacer algo.</em></h1>
    <p>
      Guardá tus planes, retomá un grupo y encontrá una idea que les cierre a
      todos.
    </p>
  </div>
  <form class="auth-form" action="/login" method="post">
    <label for="username">Usuario o email</label
    ><input id="username" name="username" type="text" required /><label
      for="password"
      >Contraseña</label
    ><input id="password" name="password" type="password" required /><button
      class="dark-button"
      type="submit"
    >
      Iniciar sesión <span>→</span>
    </button>
    <p>¿Todavía no tenés cuenta? <a href="/register">Creala acá</a></p>
  </form>
</section>
{% endblock %}
